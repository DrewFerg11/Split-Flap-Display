; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name=Split Flap Display
default_envs=esp32_n4
boards_dir=.pio/boards
data_dir=.pio/build/littlefs

[env]
framework=arduino
board_build.filesystem=littlefs
; Larger app slots than the stock table - see comment in partitions_4MB.csv.
; NOTE: littlefs moved from 0x290000 to 0x310000; keep release.yml merge_bin
; offsets in sync.
board_build.partitions=partitions_4MB.csv
platform=platformio/espressif32
upload_protocol=esptool

extra_scripts=
    pre:build/scripts/inject_version.py
    post:build/scripts/gzip_littlefs.py
    post:build/scripts/check_app_size.py

lib_deps=
    bblanchon/ArduinoJson@^7.3.1
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    hmueller01/PubSubClient3
    jnthas/Improv WiFi Library@^0.0.4

build_flags=
    '-D STARTUP_DELAY=2000'
    ; '-D WIFI_SSID="MySsid"' ; hardcoded wifi credentials
    ; '-D WIFI_PASS="123456"' ; ( for settings development )

; OTA-specific settings (can be combined with any env)
[env:ota]
upload_protocol=espota
upload_port=splitflap.local
; upload_flags = --auth=yourpassword

; Env naming rule: esp32[<chip-suffix>]_n<flashMB>[r<psramMB>][_ota]
;   - chip suffix: the Espressif family token, lowercase, no separator
;     (c3, s3, c6, p4...); the original ESP32 has no suffix.
;   - n<MB>: flash size - always present, selects the partition table.
;   - r<MB>: PSRAM size - only present when PSRAM is enabled; selects the
;     board definition / bootloader memory mode (quad vs octal), not the
;     partition table.
;   - _ota: unchanged upload-transport suffix.
; See https://drewferg11.github.io/Split-Flap-Display/firmware/hardware/#naming-convention for the rationale.

[env:esp32c3_n4]
extends=env
board=esp32-c3-devkitm-1
monitor_speed=460800

build_flags=
    ${env.build_flags}
    '-D SERIAL_SPEED=460800'
    '-D ARDUINO_USB_MODE=1'
    '-D ARDUINO_USB_CDC_ON_BOOT=1'
    '-D SDA_PIN=8'
    '-D SCL_PIN=9'

[env:esp32c3_n4_ota]
extends=env:esp32c3_n4, env:ota

; Boards #4/#5 (S3 SuperMini, Waveshare S3-Zero) - ESP32-S3FH4R2, 4MB/2MB quad.
[env:esp32s3_n4r2]
extends=env
board=esp32-s3-fh4r2
monitor_speed=115200

build_flags=
    ${env.build_flags}
    '-D SERIAL_SPEED=115200'
    '-D ARDUINO_USB_MODE=1'
    '-D ARDUINO_USB_CDC_ON_BOOT=1'
    '-D WIFI_TX_POWER=28'
    '-D SDA_PIN=8'
    '-D SCL_PIN=9'

[env:esp32s3_n4r2_ota]
extends=env:esp32s3_n4r2, env:ota

[env:esp32_n4]
extends=env
board=esp32dev
monitor_speed=115200

build_flags=
    ${env.build_flags}
    '-D SERIAL_SPEED=115200'
    '-D SDA_PIN=21'
    '-D SCL_PIN=22'
    '-D SDA2_PIN=33'
    '-D SCL2_PIN=32'
    '-D ENABLE_DUAL_I2C=1'

[env:esp32_n4_ota]
extends=env:esp32_n4, env:ota
