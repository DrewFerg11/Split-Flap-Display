<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title x-text="header"></title>
        <style>
            [x-cloak] {
                display: none !important;
            }
        </style>
        <link rel="stylesheet" href="index.css" />
        <script defer src="index.js" type="module"></script>
    </head>
    <body
        x-data="page('Control')"
        class="flex flex-col items-center justify-center min-h-screen bg-neutral-900 text-gray-100"
    >
        <div
            x-data="settings"
            class="flex flex-col items-center justify-center bg-neutral-800 shadow-[0_0_30px_10px_#222] p-6 m-6 rounded-lg max-w-lg w-11/12 text-center"
        >
            <div class="relative flex items-center w-full mb-6">
                <h1
                    class="relative text-7xl font-bold mx-auto px-4 line-through decoration-neutral-800 decoration-6px"
                    x-text="header"
                ></h1>
            </div>

            <label class="block text-left text-lg mb-4">Select Mode:</label>
            <select
                class="w-full p-3 mb-6 text-lg border border-neutral-600 rounded-md text-center bg-neutral-700 text-white"
                x-model.number="settings.mode"
                @change="stopAccuracyTest()"
            >
                <option value="2">Date</option>
                <option value="3">Time</option>
                <option value="10" x-show="isDualI2C" x-cloak>
                    Date + Time
                </option>
                <!--        <option value="4">Count</option>-->
                <option value="6">Custom Text</option>
                <option value="5">Random</option>
                <option value="9">Accuracy Test</option>
            </select>

            <template x-if="settings.mode == 6">
                <div class="w-full">
                    <!-- Row 1: Single/Multiple + Center toggles -->
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div class="flex items-center gap-4">
                            <label
                                class="text-lg font-medium"
                                x-text="singleMode ? 'Single' : 'Multiple'"
                            ></label>
                            <label class="relative inline-block w-12 h-6">
                                <input
                                    type="checkbox"
                                    x-model="singleMode"
                                    class="hidden"
                                />
                                <span
                                    class="absolute inset-0 bg-neutral-600 rounded-full cursor-pointer transition duration-300"
                                ></span>
                                <span
                                    class="absolute left-1 top-1 w-4 h-4 bg-neutral-300 cursor-pointer rounded-full transition-transform duration-300"
                                    :class="singleMode ? 'translate-x-0' : 'translate-x-6'"
                                ></span>
                            </label>
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="text-lg font-medium">Center</label>
                            <label class="relative inline-block w-12 h-6">
                                <input
                                    type="checkbox"
                                    x-model="centerText"
                                    class="hidden"
                                />
                                <span
                                    class="absolute inset-0 bg-neutral-600 rounded-full cursor-pointer transition duration-300"
                                ></span>
                                <span
                                    class="absolute left-1 top-1 w-4 h-4 cursor-pointer rounded-full transition-transform duration-300"
                                    :class="centerText ? 'translate-x-6 bg-green-600' : 'translate-x-0 bg-neutral-300'"
                                ></span>
                            </label>
                        </div>
                        <!-- Combined/Separate toggle — dual mode only -->
                        <div
                            class="flex items-center gap-4"
                            x-show="isDualI2C"
                            x-cloak
                        >
                            <label
                                class="text-lg font-medium"
                                x-text="separateRows ? 'Separate' : 'Combined'"
                            ></label>
                            <label class="relative inline-block w-12 h-6">
                                <input
                                    type="checkbox"
                                    x-model="separateRows"
                                    class="hidden"
                                />
                                <span
                                    class="absolute inset-0 bg-neutral-600 rounded-full cursor-pointer transition duration-300"
                                ></span>
                                <span
                                    class="absolute left-1 top-1 w-4 h-4 cursor-pointer rounded-full transition-transform duration-300"
                                    :class="separateRows ? 'translate-x-0 bg-white' : 'translate-x-6 bg-neutral-300'"
                                ></span>
                            </label>
                        </div>
                    </div>

                    <!-- Single word mode -->
                    <div class="w-full" x-show="singleMode" x-cloak>
                        <!-- Combined (or single-bus): one input -->
                        <div x-show="!isDualI2C || !separateRows">
                            <label
                                for="singleWord"
                                class="block text-left text-lg"
                                >Custom Text:</label
                            >
                            <input
                                type="text"
                                x-model="singleWord"
                                id="singleWord"
                                placeholder="Enter text"
                                class="w-full p-3 mt-2 text-lg rounded-md text-center bg-neutral-700 text-white transition-colors"
                                :class="singleWord.length > wireCount + (isDualI2C ? wire1Count : 0)
                                    ? 'border-2 border-red-500'
                                    : 'border border-neutral-600'"
                            />
                            <div class="flex justify-end mt-1">
                                <span
                                    class="text-sm"
                                    :class="singleWord.length > wireCount + (isDualI2C ? wire1Count : 0)
                                        ? 'text-red-400' : 'text-neutral-400'"
                                    x-text="`${wireCount + (isDualI2C ? wire1Count : 0) - singleWord.length} / ${wireCount + (isDualI2C ? wire1Count : 0)}`"
                                ></span>
                            </div>
                        </div>
                        <!-- Separate rows: two inputs -->
                        <div x-show="isDualI2C && separateRows">
                            <label class="block text-left text-lg"
                                >Row 1:</label
                            >
                            <input
                                type="text"
                                x-model="row1"
                                placeholder="Enter Row 1 text"
                                class="w-full p-3 mt-2 text-lg rounded-md text-center bg-neutral-700 text-white transition-colors"
                                :class="row1.length > wireCount
                                    ? 'border-2 border-red-500'
                                    : 'border border-neutral-600'"
                            />
                            <div class="flex justify-end mt-1">
                                <span
                                    class="text-sm"
                                    :class="row1.length > wireCount ? 'text-red-400' : 'text-neutral-400'"
                                    x-text="`${wireCount - row1.length} / ${wireCount}`"
                                ></span>
                            </div>
                            <label class="block text-left text-lg mt-4"
                                >Row 2:</label
                            >
                            <input
                                type="text"
                                x-model="row2"
                                placeholder="Enter Row 2 text"
                                class="w-full p-3 mt-2 text-lg rounded-md text-center bg-neutral-700 text-white transition-colors"
                                :class="row2.length > wire1Count
                                    ? 'border-2 border-red-500'
                                    : 'border border-neutral-600'"
                            />
                            <div class="flex justify-end mt-1">
                                <span
                                    class="text-sm"
                                    :class="row2.length > wire1Count ? 'text-red-400' : 'text-neutral-400'"
                                    x-text="`${wire1Count - row2.length} / ${wire1Count}`"
                                ></span>
                            </div>
                        </div>
                    </div>

                    <!-- Multiple words mode -->
                    <div class="w-full mt-6" x-show="!singleMode" x-cloak>
                        <label class="block text-left text-lg"
                            >Word List:</label
                        >
                        <div
                            class="flex flex-wrap gap-2 p-3 rounded-lg min-h-[50px] items-center bg-neutral-700 transition-colors"
                            :class="multiWords.length > 0 ? 'border-green-600 border-2' : 'border-transparent border-2'"
                        >
                            <template x-if="multiWords.length === 0">
                                <span class="text-neutral-400 text-sm italic"
                                    >No words added yet</span
                                >
                            </template>
                            <template
                                x-for="(word, index) in multiWords"
                                :key="index"
                            >
                                <span
                                    class="flex items-center gap-2 px-3 py-1 text-white rounded-full text-sm"
                                    :class="isWordOverLimit(word, index) ? 'bg-red-600' : 'bg-green-600'"
                                >
                                    <span x-text="word"></span>
                                    <button
                                        class="font-bold text-white hover:text-neutral-200"
                                        x-on:click="removeWord(index)"
                                    >
                                        ×
                                    </button>
                                </span>
                            </template>
                        </div>

                        <div class="flex gap-4 items-center mt-4">
                            <input
                                class="flex-1 p-3 text-lg border border-neutral-600 rounded-md bg-neutral-700 text-white"
                                type="text"
                                placeholder="Type a word"
                                x-model="multiWord"
                            />
                            <button
                                class="p-3 text-lg font-semibold text-white bg-green-600 rounded-md hover:bg-green-500 transition-colors"
                                x-on:click="addWord"
                            >
                                Add
                            </button>
                        </div>
                        <div class="flex justify-end mt-1">
                            <span
                                class="text-sm text-neutral-400"
                                x-text="maxCharsHint"
                            ></span>
                        </div>

                        <div class="mt-4">
                            <label for="delay" class="block text-left text-lg"
                                >Pause Between Words (seconds):</label
                            >
                            <input
                                class="w-full p-3 mt-2 text-lg border border-neutral-600 rounded-md text-center bg-neutral-700 text-white"
                                type="number"
                                id="delay"
                                min="1"
                                placeholder="Enter delay"
                                x-model="delay"
                            />
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="settings.mode == 9">
                <div class="w-full">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-left text-lg mt-4"
                                >Delay (seconds)</label
                            >
                            <input
                                type="number"
                                x-model.number="accuracyDelay"
                                min="1"
                                placeholder="5"
                                class="w-full p-3 mt-2 text-lg border border-neutral-600 rounded-md text-center bg-neutral-700 text-white"
                            />
                        </div>
                        <div>
                            <label class="block text-left text-lg mt-4"
                                >Step Size (flaps)</label
                            >
                            <input
                                type="number"
                                x-model.number="accuracyStepSize"
                                min="1"
                                placeholder="1"
                                class="w-full p-3 mt-2 text-lg border border-neutral-600 rounded-md text-center bg-neutral-700 text-white"
                            />
                        </div>
                    </div>
                    <template x-if="accuracyInterval !== null">
                        <div class="text-center mt-6">
                            <div
                                class="text-8xl font-bold text-white mb-3"
                                x-text="accuracyCurrentChar === ' ' ? '(space)' : accuracyCurrentChar"
                            ></div>
                            <div class="text-neutral-400 text-lg">
                                Cycle
                                <span
                                    class="text-white font-semibold"
                                    x-text="accuracyLoopCount + 1"
                                ></span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <button
                class="w-full p-3 mt-6 text-lg font-semibold text-white bg-green-600 rounded-md hover:bg-green-500 transition-colors"
                x-on:click="() => setTimeout(() => updateDisplay(), 0)"
                x-text="settings.mode === 9
                    ? (accuracyInterval !== null ? 'Restart Test' : 'Start Test')
                    : 'Update Display'"
            ></button>

            <a
                href="settings.html"
                class="p-3 mt-4 text-lg font-semibold text-white hover:text-amber-600 text-center block transition-colors"
                >Settings</a
            >
        </div>
        <div
            class="fixed top-4 left-1/2 transform -translate-x-1/2 p-4 text-white rounded-md transition duration-300"
            :class="{'bg-green-600': dialog.type === 'success', 'bg-red-500': dialog.type === 'error'}"
            x-show="dialog.show"
            x-text="dialog.message"
            x-cloak
        ></div>
    </body>
</html>
