name: Deploy Documentation

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feature/**'
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Fork PRs get a read-only GITHUB_TOKEN, so the gh-pages push below would
    # fail (cosmetic red X on every fork PR touching docs/). Skip cleanly.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Set deploy path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_dir=." >> $GITHUB_OUTPUT
            echo "preview_url=https://drewferg11.github.io/Split-Flap-Display/" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "deploy_dir=preview/${SAFE_BRANCH}" >> $GITHUB_OUTPUT
            echo "preview_url=https://drewferg11.github.io/Split-Flap-Display/preview/${SAFE_BRANCH}/" >> $GITHUB_OUTPUT
          fi

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages
        run: |
          DEPLOY_DIR="${{ steps.path.outputs.deploy_dir }}"

          cd gh-pages-dir

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Skip Jekyll processing - serve everything as plain static files.
          # Without this, GitHub Pages can be slow/inconsistent about picking up
          # freshly-added top-level paths (observed firsthand with releases/).
          touch .nojekyll

          if [ "$DEPLOY_DIR" = "." ]; then
            # Main branch: replace everything except the preview and releases folders
            # (releases/ holds firmware binaries published by release.yml for the
            # ESP Web Tools install page - see docs/firmware/install-web-flasher.md)
            find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'preview' ! -name 'releases' ! -name '.nojekyll' -exec rm -rf {} +
            cp -r ../site/. .
          else
            # Feature branch: deploy into preview subdirectory only
            rm -rf "$DEPLOY_DIR"
            mkdir -p "$(dirname "$DEPLOY_DIR")"
            cp -r ../site "$DEPLOY_DIR"
          fi

          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"
          git push

      - name: Summary
        run: echo "### Deployed to [${{ steps.path.outputs.preview_url }}](${{ steps.path.outputs.preview_url }})" >> $GITHUB_STEP_SUMMARY
