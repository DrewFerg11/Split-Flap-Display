name: CI / Format

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when the same PR/branch is pushed again.
concurrency:
  group: ci-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Clang Format
        uses: jidicula/clang-format-action@v4.15.0
        with:
            clang-format-version: '20'
            check-path: 'src'

      - name: Check test C++ formatting
        uses: jidicula/clang-format-action@v4.15.0
        with:
            clang-format-version: '20'
            check-path: 'tests'

      - name: Run Prettier
        run: ./node_modules/.bin/prettier --check 'src/**/*.{js,json,css,html}' 'tests/web/*.mjs' platformio.ini package.json README.md vite.config.mjs tailwind.config.js
