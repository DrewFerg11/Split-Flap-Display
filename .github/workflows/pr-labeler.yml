name: CI / Labeler

# Labels PRs from their Conventional-Commit-style title prefix (feat:, fix:,
# docs:, deps:) so GitHub's release notes group them per .github/release.yml
# without anyone hand-labeling. Purely additive: it never removes existing
# labels, so a manual label always wins.
#
# Uses pull_request_target so PRs from forks still get a write-scoped token
# (a plain pull_request token is read-only on forks). We only read the PR title
# for string matching and never check out or run PR code, so this is safe.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from title prefix
        uses: actions/github-script@v7
        with:
          script: |
            // Map the Conventional-Commit type to a label that matches a
            // category in .github/release.yml. Types not listed here (chore,
            // ci, refactor, test, style, perf, etc.) intentionally get no
            // label and fall into the "Other Changes" catch-all.
            const MAP = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              deps: "dependencies",
            };

            const title = context.payload.pull_request.title || "";
            // Match a leading "type" with optional "(scope)" and optional "!":
            //   feat: ...   fix(api): ...   docs!: ...
            const m = title.match(/^\s*(\w+)(?:\([^)]*\))?!?:/);
            if (!m) {
              core.info(`No conventional prefix in title: "${title}"`);
              return;
            }

            const label = MAP[m[1].toLowerCase()];
            if (!label) {
              core.info(`Prefix "${m[1]}" has no mapped label; skipping.`);
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = context.payload.pull_request.labels.map((l) => l.name);
            if (existing.includes(label)) {
              core.info(`Label "${label}" already present; nothing to do.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [label],
            });
            core.info(`Added label "${label}" from prefix "${m[1]}".`);
