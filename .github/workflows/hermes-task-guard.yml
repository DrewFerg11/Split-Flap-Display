name: Hermes / Task Guard

# Issue templates have no per-user visibility control, so anyone who can open
# issues on this repo can pick the Hermes Task template. A hermes-task label
# alone can't trigger any action (only a human-applied hermes:go can), but we
# don't want the backlog noise either. This closes the gap: only Drew or the
# Hermes bot may file a hermes-task issue.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  guard:
    if: contains(github.event.issue.labels.*.name, 'hermes-task')
    runs-on: ubuntu-latest
    steps:
      - name: Close if author is not allowed
        if: >-
          github.event.issue.user.login != 'DrewFerg11' &&
          github.event.issue.user.login != 'drewferg11-claude-bot[bot]' &&
          github.event.issue.user.login != 'drewferg11-hermes-bot[bot]' &&
          github.event.issue.user.login != 'drewferg11-ollama-bot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for the interest, but Hermes Task issues are reserved for repo-internal planning and aren't open to outside contributors. If you've found a bug or have a feature idea, please file a **Bug Report** or **Feature Request** instead — those are reviewed and commented on."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
