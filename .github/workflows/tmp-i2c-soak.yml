# TEMPORARY evidence for #89 - removed before this PR leaves draft.
# Boots the 16-module dual-bus layout repeatedly in the published Split-Flap-Emulator
# QEMU image, for this PR's build and for released v1.4.1, and counts I2C write
# timeouts (error code 5) and drum stalls.
name: TEMP / I2C soak (#89)

on:
  pull_request:

permissions:
  contents: read

env:
  FLAPSIM_IMAGE: ghcr.io/drewferg11/split-flap-emulator:0.1.0@sha256:acd9a51fe50c91530df3e1583ce070cb17e712d31d8d415654c43d97879d3935
  BASELINE_URL: https://github.com/DrewFerg11/Split-Flap-Display/releases/download/v1.4.1/splitflap-esp32_n4-v1.4.1-factory.bin
  BASELINE_SHA256: 5a71579b127ee87f0716cb1df938c9f98d3519a9283f72c003dfb857db32e6f4
  RUNS_PER_SHARD: 6

jobs:
  build:
    name: Build this PR's esp32_n4 factory image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Same cache as CI / Build: platformio.ini doesn't pin the espressif32 platform,
      # so a fresh install can pull a newer toolchain that this source doesn't build with.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - run: pio run -e esp32_n4
      - run: pio run -e esp32_n4 -t buildfs
      - name: Merge factory image
        run: |
          PKG_DIR=$(find "$HOME/.platformio/packages" -maxdepth 1 -iname 'framework-arduinoespressif32*' -type d | head -1)
          ESPTOOL=$(find "$HOME/.platformio/packages" -maxdepth 3 -iname 'esptool.py' -path '*tool-esptoolpy*' | head -1)
          python "$ESPTOOL" --chip esp32 merge_bin -o fixed-factory.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 .pio/build/esp32_n4/bootloader.bin \
            0x8000 .pio/build/esp32_n4/partitions.bin \
            0xe000 "$PKG_DIR/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/esp32_n4/firmware.bin \
            0x310000 .pio/build/esp32_n4/littlefs.bin
          ls -l fixed-factory.bin
      - uses: actions/upload-artifact@v4
        with:
          name: soak-fixed-factory
          path: fixed-factory.bin
          retention-days: 3

  soak:
    name: Soak ${{ matrix.variant }} / shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, baseline]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'fixed'
        with:
          name: soak-fixed-factory
      - name: Select firmware
        run: |
          if [ "${{ matrix.variant }}" = baseline ]; then
            curl -fsSL -o firmware.bin "$BASELINE_URL"
            echo "$BASELINE_SHA256  firmware.bin" | sha256sum -c
          else
            mv fixed-factory.bin firmware.bin
          fi
          sha256sum firmware.bin
      - run: docker pull "$FLAPSIM_IMAGE"
      - name: Boot 16 modules repeatedly
        run: |
          mkdir -p out
          for i in $(seq 1 "$RUNS_PER_SHARD"); do
            seed=$(( ${{ matrix.shard }} * 100 + i ))
            if docker run --rm --network none --user "$(id -u):$(id -g)" \
                 --mount "type=bind,source=$PWD/firmware.bin,target=/firmware.bin,readonly" \
                 --mount "type=bind,source=$PWD/out,target=/out" "$FLAPSIM_IMAGE" \
                 run --firmware /firmware.bin --hardware esp32-16-dual --scenario boot \
                 --timing ci --seed "$seed" --out "/out/run-$seed" > "out/run-$seed.log" 2>&1; then
              result=pass
            else
              result=fail
            fi
            timeouts=$(grep -c 'error code: 5' "out/run-$seed/serial.log" 2>/dev/null || true)
            error=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('error') or '')" "out/run-$seed/run.json" 2>/dev/null || true)
            echo "${{ matrix.variant }} seed=$seed result=$result write_timeouts=${timeouts:-0} error=$error" | tee -a out/results.txt
          done
      - name: Summary
        if: always()
        run: cat out/results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.variant }}-${{ matrix.shard }}
          retention-days: 3
          path: |
            out/results.txt
            out/*.log
            out/run-*/serial.log
            out/run-*/run.json
            out/run-*/report.md
