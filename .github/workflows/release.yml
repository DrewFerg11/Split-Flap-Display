name: Release / Tag

on:
  push:
    tags:
      - "v*"
  # Manual re-run. Select an existing v* tag as the ref -- the release
  # environment's deployment policy rejects anything else.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and simulate without publishing GitHub Release or Pages
        type: boolean
        default: true
      sim_probe:
        description: Assert a deliberate rejection (dry run only)
        type: choice
        default: none
        options: [none, wrong-version, missing, corrupt, timeout]

permissions:
  contents: read

env:
  # GitHub Release asset URLs don't send CORS headers, so ESP Web Tools (running
  # in the browser) can't fetch manifests/binaries from github.com/.../releases/download/.
  # We publish a same-origin copy to GitHub Pages instead; see the "Publish binaries
  # to GitHub Pages" step below and docs/firmware/install-web-flasher.md.
  PAGES_BASE_URL: https://drewferg11.github.io/Split-Flap-Display
  # Type-aware rolling window for the Pages copy of release binaries - keep the
  # N most-recently-published RC/beta folders and the M most-recently-published
  # stable folders, independently, so frequent RCs can't push stable releases
  # out of the window before enough stable versions accumulate (and vice
  # versa). Must match the version-picker caps in install-web-flasher.md.
  RC_KEEP_COUNT: 3
  STABLE_KEEP_COUNT: 5

jobs:
  # Gate every release on manual approval, restricted to the repo owner.
  #
  # Every job below depends on this one, which uses the `release`
  # environment. That environment requires the owner's approval before any
  # job using it can proceed - enforced server-side by GitHub, regardless of
  # who or what triggered the run. The actor check below is a cheap
  # belt-and-braces failsafe that fails fast with a readable message.
  #
  # This is paired with a tag ruleset (refs/tags/v*) that blocks direct tag
  # push/update/delete for everyone except repo admins, so the only way to
  # start this workflow from a `push: tags` event is as an admin already.
  # Tags are pushed manually (`git tag vX.Y.Z && git push origin vX.Y.Z`) --
  # Actions never creates one itself, since the GITHUB_TOKEN identity isn't a
  # bypass actor on the ruleset and can't be added to one on a user-owned repo.
  authorize:
    name: authorize release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Verify actor
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Releases are restricted to $OWNER. Actor was $ACTOR."
            exit 1
          fi
          echo "Release authorized for $ACTOR at $GITHUB_REF."
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}

      - name: Verify ref is a version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Expected a vX.Y.Z or vX.Y.Z-rc.N tag, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME"

      - name: Restrict probes to manual dry runs
        env:
          PROBE: ${{ inputs.sim_probe || 'none' }}
          # Only a tag push, or a dispatch that explicitly sets dry_run=false, may publish. A missing
          # input is a dry run (string compare: in expressions null == false is true).
          DRY_RUN: ${{ (github.event_name == 'push' || format('{0}', inputs.dry_run) == 'false') && 'false' || 'true' }}
        run: |
          if [ "$PROBE" != none ] && [ "$DRY_RUN" != true ]; then
            echo "::error::Simulation probes require a manual dry run."
            exit 1
          fi

  build:
    name: Build (${{ matrix.env }})
    needs: [authorize]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: esp32_n4
            chip: esp32
            bootloader_offset: "0x1000"
          - env: esp32c3_n4
            chip: esp32c3
            bootloader_offset: "0x0"
          - env: esp32s3_n4r2
            chip: esp32s3
            bootloader_offset: "0x0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run assets

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        # Embed the tag being released. git describe can pick a prerelease tag
        # when vX.Y.Z and vX.Y.Z-rc.N point at the same commit.
        env:
          FIRMWARE_VERSION_OVERRIDE: ${{ github.ref_name }}
        run: pio run -e ${{ matrix.env }} | tee build.log

      - name: Extract flash usage
        run: |
          # Use the APPSIZE line (actual firmware.bin size vs app partition,
          # from build/scripts/check_app_size.py) - NOT PlatformIO's "Flash:"
          # figure, which omits MMU-alignment padding and understates the
          # image the bootloader actually validates against the partition.
          LINE=$(grep -oE 'APPSIZE: firmware\.bin is [0-9]+ bytes, app partition is [0-9]+ bytes' build.log | tail -1)
          USED=$(echo "$LINE" | grep -oE '[0-9]+' | head -1)
          TOTAL=$(echo "$LINE" | grep -oE '[0-9]+' | tail -1)
          mkdir -p meta
          echo "${{ matrix.env }}|${USED}|${TOTAL}" > meta/flash-${{ matrix.env }}.txt
          cat meta/flash-${{ matrix.env }}.txt

      - name: Build filesystem image
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Locate framework tools
        id: tools
        run: |
          PKG_DIR=$(find "$HOME/.platformio/packages" -maxdepth 1 -iname 'framework-arduinoespressif32*' -type d | head -1)
          echo "boot_app0=$PKG_DIR/tools/partitions/boot_app0.bin" >> "$GITHUB_OUTPUT"
          ESPTOOL=$(find "$HOME/.platformio/packages" -maxdepth 3 -iname 'esptool.py' -path '*tool-esptoolpy*' | head -1)
          echo "esptool=$ESPTOOL" >> "$GITHUB_OUTPUT"

      - name: Build merged factory image
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          python "${{ steps.tools.outputs.esptool }}" --chip ${{ matrix.chip }} merge_bin \
            -o "splitflap-${{ matrix.env }}-${VERSION}-factory.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            ${{ matrix.bootloader_offset }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0xe000 "${{ steps.tools.outputs.boot_app0 }}" \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            0x310000 .pio/build/${{ matrix.env }}/littlefs.bin

      - name: Copy app-only image
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cp .pio/build/${{ matrix.env }}/firmware.bin "splitflap-${{ matrix.env }}-${VERSION}-app.bin"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.env }}
          path: splitflap-${{ matrix.env }}-*.bin
          retention-days: 5

      - name: Upload flash metadata
        uses: actions/upload-artifact@v4
        with:
          name: flashmeta-${{ matrix.env }}
          path: meta/flash-${{ matrix.env }}.txt
          retention-days: 5

  sim-test:
    name: Strict release simulation (${{ matrix.layout }})
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        layout: ['8', '16']
    steps:
      - name: Start simulation budget and record runner
        run: |
          echo "SIM_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          lscpu > runner-specs.txt
      - name: Checkout reviewed gate helper
        uses: actions/checkout@v4
        with:
          repository: DrewFerg11/Split-Flap-Emulator
          ref: 3ba32a9d85bdcfa655907c793e2d1c30a7859f0f  # emulator v0.1.0
          path: emulator
          persist-credentials: false
      - name: Download this run's ESP32 factory artifact
        uses: actions/download-artifact@v4
        with:
          name: bins-esp32_n4
          path: factory
      - name: Test the exact release factory image
        env:
          # Emulator v0.1.0, pinned by digest (the gate helper accepts only a digest). Update it
          # together with the helper ref above, from the release's recorded publication result.
          FLAPSIM_IMAGE: ghcr.io/drewferg11/split-flap-emulator@sha256:acd9a51fe50c91530df3e1583ce070cb17e712d31d8d415654c43d97879d3935
          RELEASE_VERSION: ${{ github.ref_name }}
          LAYOUT: ${{ matrix.layout }}
          PROBE: ${{ inputs.sim_probe || 'none' }}
        run: |
          python3 emulator/tools/verify_release_gate.py run \
            --image "$FLAPSIM_IMAGE" --version "$RELEASE_VERSION" \
            --artifact-dir factory --out evidence --layout "$LAYOUT" --probe "$PROBE"
      - name: Retain available simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sim-${{ matrix.layout }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
            runner-specs.txt
      - name: Record total simulation job duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - SIM_STARTED ))
          echo "Simulation job (including checkout, pull, artifacts): ${ELAPSED}s" >> "$GITHUB_STEP_SUMMARY"

  publish-eligibility:
    name: Verify publication dependencies
    needs: [authorize, build, sim-test]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Require every build and both strict simulations
        id: check
        env:
          AUTH_RESULT: ${{ needs.authorize.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SIM_RESULT: ${{ needs.sim-test.result }}
          # Only a tag push, or a dispatch that explicitly sets dry_run=false, may publish. A missing
          # input is a dry run (string compare: in expressions null == false is true).
          DRY_RUN: ${{ (github.event_name == 'push' || format('{0}', inputs.dry_run) == 'false') && 'false' || 'true' }}
        run: |
          if [ "$AUTH_RESULT" != success ] || [ "$BUILD_RESULT" != success ] || [ "$SIM_RESULT" != success ]; then
            echo "::error::Publication blocked: authorization=$AUTH_RESULT build=$BUILD_RESULT simulations=$SIM_RESULT"
            exit 1
          fi
          echo "Both layouts passed; publication dependencies are eligible." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = true ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Dry run: release and Pages publication disabled.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  assert-rejection:
    name: Assert dry-run failure blocks publication
    needs: [authorize, build, sim-test, publish-eligibility]
    if: >-
      always() && needs.authorize.result == 'success' && needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) != 'false' && (inputs.sim_probe || 'none') != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DrewFerg11/Split-Flap-Emulator
          ref: 3ba32a9d85bdcfa655907c793e2d1c30a7859f0f  # emulator v0.1.0
          path: emulator
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-sim-*
          path: sim-evidence
      - name: Require the intended failure in both layouts and failed eligibility
        env:
          PROBE: ${{ inputs.sim_probe }}
          SIM_RESULT: ${{ needs.sim-test.result }}
          ELIGIBILITY_RESULT: ${{ needs.publish-eligibility.result }}
        run: |
          python3 emulator/tools/verify_release_gate.py assert-probe \
            --directory sim-evidence --probe "$PROBE" \
            --sim-result "$SIM_RESULT" --eligibility-result "$ELIGIBILITY_RESULT"

  release:
    name: Publish release
    needs: [build, sim-test, publish-eligibility]
    if: needs.publish-eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & prerelease flag
        id: meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-rc.* || "$VERSION" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect commit log since previous tag
        id: commitlog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if [[ "$VERSION" == *-rc.* || "$VERSION" == *-beta* ]]; then
            # Prerelease: diff against whatever tag came immediately before
            # (RC or full), so iterative RC-to-RC testing stays incremental.
            PREV=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1)
          else
            # Full release: skip past any RCs/betas to the last full release,
            # so the changelog/AI summary covers everything since then, not
            # just the (often trivial) diff from the final RC.
            PREV=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | grep -vE -- '-rc\.|-beta' | head -1)
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}..${VERSION}" --pretty=format:"%B---")
          else
            LOG=$(git log "${VERSION}" --pretty=format:"%B---")
          fi
          {
            echo "log<<COMMITLOG_EOF"
            echo "$LOG"
            echo "COMMITLOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: AI release summary
        id: ai_summary
        if: steps.commitlog.outputs.log != ''
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You summarize firmware release commit logs for end users of an open-source
            ESP32 split-flap display project. Write 2-4 plain-prose sentences describing
            what changed, in end-user terms. No markdown headings, no bullet list, no
            preamble like "This release includes" - just the summary itself.
          prompt: ${{ steps.commitlog.outputs.log }}

      - name: Save AI summary
        if: always()
        run: |
          echo "${{ steps.ai_summary.outcome == 'success' && steps.ai_summary.outputs.response || '' }}" > ai-summary.txt

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Download flash metadata
        uses: actions/download-artifact@v4
        with:
          pattern: flashmeta-*
          path: meta
          merge-multiple: true

      - name: Generate manifests
        run: |
          python3 build/scripts/generate_manifest.py \
            "${{ steps.meta.outputs.version }}" \
            "${{ env.PAGES_BASE_URL }}/releases/${{ steps.meta.outputs.version }}" \
            dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.bin > checksums.txt

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish binaries to GitHub Pages
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          mkdir -p "gh-pages-dir/releases/${VERSION}"
          cp dist/* "gh-pages-dir/releases/${VERSION}/"

          cd gh-pages-dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Skip Jekyll processing (see docs.yml for the same fix + rationale).
          touch .nojekyll

          # Type-aware rolling window: order folders newest-published first, then
          # prune once each type's independent cap is exceeded (RCs and stables
          # counted separately, so frequent RCs can't evict stables). Ordering
          # comes from each folder's last git-commit time - durable publication
          # metadata - NOT filesystem mtime: `git checkout` resets every file's
          # mtime to checkout time, so `ls -t` would order these arbitrarily and
          # could prune a newer folder while keeping an older one. The version
          # published by this run isn't committed yet, so it's forced to newest.
          ordered=()
          for dir in releases/*/; do
            [ -d "$dir" ] || continue
            tag="$(basename "$dir")"
            if [ "$tag" = "$VERSION" ]; then
              ts=9999999999
            else
              ts="$(git log -1 --format=%ct -- "$dir")"
              ts="${ts:-0}"
            fi
            ordered+=("$ts $dir")
          done

          rc_count=0
          stable_count=0
          while read -r _ dir; do
            [ -n "$dir" ] || continue
            tag="$(basename "$dir")"
            if [[ "$tag" == *-rc.* || "$tag" == *-beta* ]]; then
              rc_count=$((rc_count + 1))
              [ "$rc_count" -gt "${{ env.RC_KEEP_COUNT }}" ] && rm -rf "$dir"
            else
              stable_count=$((stable_count + 1))
              [ "$stable_count" -gt "${{ env.STABLE_KEEP_COUNT }}" ] && rm -rf "$dir"
            fi
          done < <(printf '%s\n' "${ordered[@]}" | sort -rn -k1,1)

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish firmware binaries for ${VERSION}"
            git push
          fi

      - name: Render release notes
        run: |
          python3 build/scripts/render_release_notes.py \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.prerelease }}" \
            meta \
            release-notes.md \
            ai-summary.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
