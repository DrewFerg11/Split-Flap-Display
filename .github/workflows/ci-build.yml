name: CI / Build

on:
  pull_request:

# Fork PRs get a read-only GITHUB_TOKEN and no repo secrets, so this workflow
# needs neither - it only compiles and uploads artifacts. That's what makes it
# safe to run on fork PRs unmodified (unlike release.yml/docs.yml's deploy steps).
permissions:
  contents: read

# Cancel an in-progress run when the same PR/branch is pushed again.
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boards-sync:
    name: Boards sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check env names are in sync
        run: python3 build/scripts/check_boards_sync.py

  build:
    name: Build (${{ matrix.env }})
    needs: [boards-sync]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32_n4, esp32c3_n4, esp32s3_n4r2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run assets

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem image
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Collect artifacts for manual flashing
        run: |
          mkdir -p pr-build
          cp .pio/build/${{ matrix.env }}/bootloader.bin pr-build/
          cp .pio/build/${{ matrix.env }}/partitions.bin pr-build/
          cp .pio/build/${{ matrix.env }}/firmware.bin pr-build/
          cp .pio/build/${{ matrix.env }}/littlefs.bin pr-build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-${{ matrix.env }}
          path: pr-build/*.bin
          retention-days: 14
