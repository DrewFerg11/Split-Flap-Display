name: MakerWorld / Update badge counts

# MakerWorld's API sits behind Cloudflare bot protection that blocks
# server-side/proxied fetches outright (they can't solve a JS challenge),
# which is why both the README's shields.io badge and the docs Resources
# page's client-side badges (previously via the now-dead proxy.cors.sh)
# broke. A realistic browser User-Agent isn't challenged for most paths,
# so this job fetches the counts itself on a schedule and publishes small
# JSON files to gh-pages; the README badges (via img.shields.io/endpoint)
# and the docs page's own JS both read those instead of hitting MakerWorld
# directly. If a scheduled fetch ever gets blocked too, the job just skips
# the update for whatever failed and everything else keeps showing the
# last known-good numbers.
#
# The account-level user-service/user/profile endpoint (which would give
# an exact account-wide download/print total) is the one exception: it is
# reliably 403'd by Cloudflare specifically for GitHub-hosted runner IPs,
# even with a browser User-Agent and retries (the per-model design-service
# endpoint below is not similarly blocked, and the same profile request
# succeeds instantly from a residential IP - it's a path-specific WAF rule,
# not a generic bot check). Rather than publish a badge that can never
# actually update, the README badges are derived by summing the per-model
# counts this job already fetches successfully for the docs-tracked models.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  MW_UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

jobs:
  update:
    name: Update badge counts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch MakerWorld stats
        id: fetch
        run: |
          STAGE="$RUNNER_TEMP/badges"
          mkdir -p "$STAGE/models"

          mw_get() {
            # --retry-all-errors: a Cloudflare challenge comes back as a
            # normal HTTP 403, not a connection-level failure, so plain
            # --retry alone would never retry it.
            curl -sS -o "$2" -w '%{http_code}' "$1" \
              -A "$MW_UA" -H "Accept: application/json" -H "Accept-Language: en-US,en;q=0.9" \
              --max-time 15 --retry 2 --retry-all-errors --retry-delay 3
          }

          # --- Per-model counts (docs Resources page + README totals) ----
          # makerworld-badges.js augments any MakerWorld model link on any
          # docs page, not just resources.md, so scrape all of docs/ rather
          # than hard-coding one file - otherwise a model link added
          # elsewhere would get a permanent "Stats unavailable" pill since
          # this job would never know to fetch it.
          MODEL_IDS=$(grep -rohE 'makerworld\.com/[^) ]*models/[0-9]+' docs/ | grep -oE '[0-9]+$' | sort -un)

          for id in $MODEL_IDS; do
            CODE=$(mw_get "https://makerworld.com/api/v1/design-service/design/${id}" "/tmp/design-${id}.json")
            if [ "$CODE" = "200" ] && \
               DL=$(jq -re '.downloadCount' "/tmp/design-${id}.json") && \
               PR=$(jq -re '.printCount' "/tmp/design-${id}.json") && \
               LK=$(jq -re '.likeCount' "/tmp/design-${id}.json"); then
              # Keys here must match the STATS[].key list in
              # docs/javascripts/makerworld-badges.js - that script renders
              # only the keys present, so a mismatch silently degrades to a
              # missing badge rather than an error.
              printf '{"downloadCount":%s,"printCount":%s,"likeCount":%s}' "$DL" "$PR" "$LK" > "$STAGE/models/${id}.json"
            else
              echo "::warning::MakerWorld design fetch failed for model $id (HTTP $CODE) - keeping its last known-good values."
            fi
            sleep 1
          done

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          {
            echo "model_ids<<MODEL_IDS_EOF"
            echo "$MODEL_IDS"
            echo "MODEL_IDS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updated counts
        run: |
          cd gh-pages-dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # docs-deploy.yml can also push to gh-pages around the same time
          # (e.g. a docs change landing on main while this runs on its
          # schedule). Refresh to the latest tip right before writing, so
          # the only race window left is the few lines below, not the
          # entire job - and it can only ever reject our push, never lose
          # anything, since badges/ is never touched by the other workflow.
          git fetch origin gh-pages
          git reset --hard origin/gh-pages

          mkdir -p badges/models
          cp -a "${{ steps.fetch.outputs.stage }}/." badges/
          touch .nojekyll

          # Prune per-model files for ids no longer linked anywhere in
          # docs/ (MODEL_IDS from the fetch step), so a removed model's
          # stale counts don't keep inflating the README totals below
          # forever. Prune against the full docs-scrape set, not just
          # this run's successful fetches, so a model that's still
          # linked but failed to fetch this run keeps its last
          # known-good file and last known-good docs page badge.
          MODEL_IDS="${{ steps.fetch.outputs.model_ids }}"
          for f in badges/models/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            if ! grep -qxF "$id" <<<"$MODEL_IDS"; then
              echo "Pruning stale per-model badge for removed model $id"
              rm -f "$f"
            fi
          done

          # README totals: these badges are a docs-derived proxy for
          # "MakerWorld Downloads/Makes" (sum of the per-model counts
          # above), not a true account-wide total - see the top-of-file
          # comment for why the real account-wide endpoint can't be used
          # from here. A model published on MakerWorld but never linked
          # from docs/ won't be counted. Guard the glob with nullglob:
          # an empty badges/models/ (e.g. it was ever wiped) must not
          # hard-fail this step under the runner's default `set -e`
          # shell - keep last known-good README badge values instead.
          shopt -s nullglob
          MODEL_FILES=(badges/models/*.json)
          if [ "${#MODEL_FILES[@]}" -gt 0 ]; then
            TOTALS=$(jq -s '{downloads: (map(.downloadCount) | add // 0), prints: (map(.printCount) | add // 0)}' "${MODEL_FILES[@]}")
            DOWNLOADS=$(jq -r '.downloads' <<<"$TOTALS")
            PRINTS=$(jq -r '.prints' <<<"$TOTALS")
            printf '{"schemaVersion":1,"label":"MakerWorld Downloads","message":"%s","color":"blue","namedLogo":"bambulab"}' "$DOWNLOADS" > badges/makerworld-downloads.json
            printf '{"schemaVersion":1,"label":"MakerWorld Makes","message":"%s","color":"orange","namedLogo":"bambulab"}' "$PRINTS" > badges/makerworld-prints.json
          else
            echo "::warning::No per-model badge files present - keeping last known-good README badge values."
          fi

          git add badges/
          if git diff --cached --quiet; then
            echo "No change in counts - nothing to publish"
          else
            git commit -m "Update MakerWorld badge counts"
            git push
          fi
