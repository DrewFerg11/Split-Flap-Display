# Configures GitHub's automatically generated release notes (the "What's Changed"
# list produced by generate_release_notes: true in release.yml). Groups merged
# PRs into sections by label. PRs are matched top-to-bottom; the first matching
# category wins, and "*" is the catch-all for anything unlabeled.
#
# Note: this lists merged pull requests, not raw commits - so it populates once
# releases are cut from `main` after PRs merge (releases built from a WIP
# feature branch of direct commits will show an empty list, which is expected).
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: 📖 Documentation
      labels:
        - documentation
        - docs
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: 🧹 Other Changes
      labels:
        - "*"
